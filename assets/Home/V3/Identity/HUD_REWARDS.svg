<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8652c"/><stop offset="0.55" stop-color="#7a4318"/><stop offset="1" stop-color="#4a260c"/>
    </linearGradient>
    <linearGradient id="lidwood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c47a38"/><stop offset="1" stop-color="#83481a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff3b0"/><stop offset="0.35" stop-color="#f2c744"/><stop offset="0.7" stop-color="#c8911c"/><stop offset="1" stop-color="#7d5208"/>
    </linearGradient>
    <linearGradient id="goldv" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe98a"/><stop offset="0.5" stop-color="#d9a52a"/><stop offset="1" stop-color="#8a5c0c"/>
    </linearGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000" stop-opacity="0.35"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <ellipse cx="32" cy="56.5" rx="23" ry="3.5" fill="url(#shadow)"/>
  <!-- body -->
  <rect x="9" y="30" width="46" height="25" rx="3" fill="url(#wood)" stroke="#3a1d08" stroke-width="1.2"/>
  <path d="M11 38 H53 M11 46 H53" stroke="#5a2f10" stroke-width="0.9" opacity="0.7"/>
