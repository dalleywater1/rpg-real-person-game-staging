  <path d="M13 20 C16 14 24 13 32 13 C40 13 48 14 51 20" fill="none" stroke="#e0a060" stroke-width="1.2" opacity="0.55"/>
  <!-- gold straps -->
  <path d="M15 11.5 C14 15 14 19 14 23 V55 H20 V23 C20 18 20.5 14 22 11" fill="url(#goldv)" stroke="#6b4506" stroke-width="0.9"/>
  <path d="M49 11.5 C50 15 50 19 50 23 V55 H44 V23 C44 18 43.5 14 42 11" fill="url(#goldv)" stroke="#6b4506" stroke-width="0.9"/>
  <!-- rim -->
  <rect x="8" y="28.5" width="48" height="4.5" rx="1.5" fill="url(#gold)" stroke="#6b4506" stroke-width="0.9"/>
  <!-- lock -->
