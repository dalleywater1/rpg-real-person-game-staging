  <!-- Home V3 Hero typography proof (Lyra Workstream A, 2026-09-10):
       Cinzel = identity/display, Alegreya = primary RPG UI serif,
       Alegreya Sans = micro/technical text. Alegreya Sans has no 600
       weight in the actual font family (300/400/500/700/800/900) —
       requesting 700 instead of the handover's "500/600" for that one
       face; flagged in the return report rather than silently
       requesting a weight that doesn't exist. -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Alegreya:wght@500;600&family=Alegreya+Sans:wght@500;700&display=swap">
  <!-- Leaflet (Astra Training/Running Architecture handover, 2026-09-16

       map"). OpenStreetMap tiles, no API key required. Pinned exact
       version. -->

  <!-- MapLibre GL JS (World Tours 5.2, Aster's live-map handoff §5: "do
       not hard-code World Tours to one map vendor" — OSM raster tiles
       again, same no-API-key posture as Leaflet above). Pinned to the
       4.7.1 line deliberately, not the current 6.x latest: MapLibre
       dropped its UMD/global bundle in favour of ES-modules-only
       starting with a later major, and this app's classic <script src>
       + SRI-pinning pattern (matching Leaflet) needs a real UMD file to
       hash — 4.7.1 is the newest release that still ships one. Verified
       both the JS and CSS integrity hashes below against the actual
       bytes served (not copied blind from a registry page). -->
